[project]
name = "pocketchat"
version = "0.1.0"
description = "A small ChatGPT-style language model built and trained from scratch on a single laptop GPU."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.7",
    "numpy",
    "tqdm",
    "datasets",
    "pytest",
    "regex>=2026.11.15",
]

[tool.uv.sources]
# CUDA build on Windows and Linux; macOS has no CUDA wheels and gets the standard build from PyPI
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pocketchat"]
